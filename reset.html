<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استعادة حساب الآيدون</title><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: #171613;
  color: #eee8dc;
  font-family: Tahoma, Arial, sans-serif;
}

main {
  width: 100%;
  max-width: 410px;
  padding: 30px 24px;
  border: 1px solid #65513a;
  border-radius: 12px;
  background: #211e19;
}

h2 {
  font-size: 22px;
  margin-top: 0;
}

p {
  color: #aaa294;
  line-height: 1.8;
  font-size: 13px;
}

label {
  display: block;
  margin: 18px 0 7px;
  font-size: 13px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #51483d;
  border-radius: 7px;
  background: #171613;
  color: white;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 23px;
  padding: 14px;
  border: 0;
  border-radius: 7px;
  background: #94734b;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

#message {
  margin-top: 16px;
  font-size: 13px;
  line-height: 1.8;
}
</style></head><body>
<main>
  <h2>استعادة حساب الآيدون ㊗️</h2>
  <p>إعادة تعيين كلمة مرور حساب المشرف.</p>  <form id="form">
    <label>مفتاح التهيئة السري</label>
    <input id="key" type="password" required><label>كلمة المرور الجديدة</label>
<input id="password" type="password"
  minlength="10" maxlength="128" required>

<label>تأكيد كلمة المرور</label>
<input id="confirm" type="password"
  minlength="10" maxlength="128" required>

<button id="submit" type="submit">
  تغيير كلمة المرور
</button>

  </form>  <div id="message"></div>
</main><script>
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();

  const key = document.getElementById("key").value;
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  const message = document.getElementById("message");
  const button = document.getElementById("submit");

  if (password !== confirm) {
    message.textContent = "كلمتا المرور غير متطابقتين.";
    return;
  }

  button.disabled = true;
  message.textContent = "جارٍ تغيير كلمة المرور...";

  try {
    const response = await fetch("/api/reset-admin-password", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        setup_key: key,
        username: "Kuru",
        password: password
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "تعذر تغيير كلمة المرور.");
    }

    message.textContent =
      "تم تغيير كلمة المرور بنجاح. يمكنك تسجيل الدخول الآن.";

    document.getElementById("form").reset();

  } catch (error) {
    message.textContent = error.message;
  } finally {
    button.disabled = false;
  }
});
</script></body>
</html>
